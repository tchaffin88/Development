<body>

    <!-- Header -->

    <!-- PAGE HERO -->
    <section class="page-hero">
        <h1>Pokémon Decks</h1>
        <p>Ready‑to‑play decks for beginners and competitive players.</p>

    <!-- PRODUCT GRID -->
    <section id="products" class="section">
        <h2 class="section-title">Available Decks</h2>

        <div class="product-grid">

            <!-- MEGA GENGAR EX DECK -->
            <div class="product-card">

            <!-- DRAGAPULT EX LEAGUE BATTLE DECK -->

    <footer class="footer">

    <!-- UNIFIED SHOPIFY BUY BUTTON SCRIPT -->
    <script type="text/javascript">
        (function () {
            var scriptURL = 'https://sdks.shopifycdn.com/buy-button/latest/buy-button-storefront.min.js';

            function loadScript() {
                var script = document.createElement('script');
                script.async = true;
                script.src = scriptURL;
                document.body.appendChild(script);
                script.onload = ShopifyBuyInit;
            }

            if (window.ShopifyBuy && window.ShopifyBuy.UI) {
                ShopifyBuyInit();
            } else {
                loadScript();
            }

            function ShopifyBuyInit() {
                var client = ShopifyBuy.buildClient({
                    domain: 'h1hssh-yj.myshopify.com',
                    storefrontAccessToken: '07b7243e258a34f60c4b9b1a6ac82b26',
                });

                ShopifyBuy.UI.onReady(client).then(function (ui) {

                    const products = [
                        // Replace these with your actual Shopify product IDs + component IDs:
                        { id: '9197497942204', node: 'product-component-1773104042588' },
                        { id: '9197497876668', node: 'product-component-1773103487997' },
                        { id: '9197497909436', node: 'product-component-1773103552864' },
                        { id: '9197497974972', node: 'product-component-1773103812299' },
                    ];

                    products.forEach(prod => {
                        ui.createComponent('product', {
                            id: prod.id,
                            node: document.getElementById(prod.node),
                            moneyFormat: '%24%7B%7Bamount%7D%7D',
                            options: {
                                "product": {
                                    "styles": {
                                        "button": {
                                            "font-family": "Open Sans, sans-serif",
                                            "font-size": "18px",
                                            "padding-top": "17px",
                                            "padding-bottom": "17px",
                                            "background-color": "#5106ff",
                                            "border-radius": "10px",
                                            ":hover": { "background-color": "#8a0aff" },
                                            ":focus": { "background-color": "#8a0aff" }
                                        }
                                    },
                                    "buttonDestination": "modal",
                                    "contents": { "options": false },
                                    "text": { "button": "View product" },
                                    "googleFonts": ["Open Sans"]
                                },
                                "modalProduct": {
                                    "contents": {
                                        "img": false,
                                        "imgWithCarousel": true,
                                        "button": false,
                                        "buttonWithQuantity": true
                                    },
                                    "styles": {
                                        "button": {
                                            "font-family": "Open Sans, sans-serif",
                                            "font-size": "18px",
                                            "padding-top": "17px",
                                            "padding-bottom": "17px",
                                            "background-color": "#5106ff",
                                            "border-radius": "10px",
                                            ":hover": { "background-color": "#8a0aff" },
                                            ":focus": { "background-color": "#8a0aff" }
                                        }
                                    },
                                    "googleFonts": ["Open Sans"],
                                    "text": { "button": "Add to cart" }
                                },
                                "cart": {
                                    "styles": {
                                        "button": {
                                            "font-family": "Open Sans, sans-serif",
                                            "font-size": "18px",
                                            "padding-top": "17px",
                                            "padding-bottom": "17px",
                                            "background-color": "#5106ff",
                                            "border-radius": "10px",
                                            ":hover": { "background-color": "#8a0aff" },
                                            ":focus": { "background-color": "#8a0aff" }
                                        }
                                    },
                                    "text": { "total": "Subtotal", "button": "Checkout" },
                                    "googleFonts": ["Open Sans"]
                                },
                                "toggle": {
                                    "styles": {
                                        "toggle": {
                                            "font-family": "Open Sans, sans-serif",
                                            "background-color": "#5106ff",
                                            ":hover": { "background-color": "#8a0aff" },
                                            ":focus": { "background-color": "#8a0aff" }
                                        }
                                    },
                                    "googleFonts": ["Open Sans"]
                                }
                            }
                        });
                    });

                });
            }
        })();
    </script>

</body>
